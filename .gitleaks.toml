# Escaneo de secretos (TSK-DEV2-403). Usa las reglas por defecto de gitleaks
# y excluye ejemplos y datos de prueba que no son credenciales reales.
title = "FrogPay gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Plantillas, documentación y fixtures de pruebas"
paths = [
  '''(^|/)\.env\.example$''',
  '''\.spec\.ts$''',
  '''\.e2e-spec\.ts$''',
  '''(^|/)docs/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)infra/nginx/certs/''',
  '''(^|/)scripts/k6-bank-transfer-latency\.js$''',
]
regexes = [
  '''sk_test_(xxx|placeholder|example)''',
  '''whsec_(xxx|placeholder|example)''',
  '''pm_k6_idempotency_test''',
  # Historical CI-only JWT fixture; current workflows generate the test secret at runtime.
  '''^frogpay-ci-test-secret-at-least-32-characters$''',
]
