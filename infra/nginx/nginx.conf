# FrogPay · Proxy inverso con TLS (TSK-DEV2-403)
# Desarrollo: certificado autofirmado generado con scripts/generate-dev-cert.sh
# Con "docker compose up --scale api=2" NGINX reparte la carga entre las réplicas (TSK-DEV2-404).

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;

  # DNS interno de Docker: resuelve todas las réplicas de "api".
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream frogpay_api {
    zone frogpay_api 64k;
    server api:4000 resolve;
    keepalive 32;
  }

  upstream frogpay_dashboard {
    zone frogpay_dashboard 64k;
    server dashboard:3000 resolve;
  }

  # Límite de respaldo por IP (el límite por tenant y API Key lo aplica la API con Redis).
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/frogpay.crt;
    ssl_certificate_key /etc/nginx/certs/frogpay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;

    # API REST, Swagger y health
    location ~ ^/(api|health)(/|$) {
      limit_req zone=per_ip burst=100 nodelay;
      limit_req_status 429;
      proxy_pass http://frogpay_api;
    }

    # /metrics solo desde la red interna (Prometheus lo consulta directo a api:4000)
    location = /metrics {
      return 404;
    }

    # Dashboard (Next.js), con soporte de WebSocket para el modo desarrollo
    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://frogpay_dashboard;
    }
  }
}
