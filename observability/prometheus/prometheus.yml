global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: frogpay-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          application: frogpay
          environment: development
          service: api

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692
        labels:
          application: frogpay
          service: rabbitmq

  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
