name: API CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/frogpay
          DIRECT_URL: postgresql://ci:ci@localhost:5432/frogpay
      - name: Lint API
        run: npm run lint --workspace apps/api
      - name: Build API
        run: npm run build --workspace apps/api
      - name: Run API unit tests
        run: npm test --workspace apps/api -- --runInBand --testPathIgnorePatterns=adapters/stripe/stripe-payment-provider.sandbox.spec.ts
      - name: Security - npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    # TSK-DEV2-403: escaneo de secretos con gitleaks en todo el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
